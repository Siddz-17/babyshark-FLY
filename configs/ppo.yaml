# PPO Training Configuration for Drosophila Dance Controller
env:
  duration: 3.0
  dt: 0.002
  default_bpm: 120.0
  randomize_tempo: true
  backend: "simple"            # "simple" (high-speed) or "mujoco" (full physics)
  connectome_mode: "biological" # "biological" (Mode B) or "engineered" (Mode A)

ppo:
  total_timesteps: 40000
  num_envs: 4
  num_steps: 256
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  update_epochs: 4
  minibatch_size: 64
  clip_coef: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5

checkpoints:
  save_dir: "checkpoints"
  model_name: "best_dance_policy.pt"
